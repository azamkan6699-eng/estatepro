<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>EstatePro – Premium Real Estate</title>
    <meta name="description" content="Browse premium properties for sale across the US. Search by city, type, and price. Find houses, apartments, villas, and more with EstatePro." />
    <meta name="author" content="EstatePro Realty Group" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://estatepro.vercel.app/" />
    <meta property="og:title"       content="EstatePro – Premium Real Estate" />
    <meta property="og:description" content="Browse premium properties for sale across the US. Search by city, type, and price." />
    <meta property="og:image"       content="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&q=80" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"   content="EstatePro" />
    <meta property="og:locale"      content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="EstatePro – Premium Real Estate" />
    <meta name="twitter:description" content="Browse premium properties for sale across the US." />
    <meta name="twitter:image"       content="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&q=80" />

    <!-- Canonical (update to your actual deployed domain) -->
    <link rel="canonical" href="https://estatepro.vercel.app/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Preconnect for Google Fonts (performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD: Organisation structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "EstatePro Realty Group",
      "url": "https://estatepro.vercel.app/",
      "logo": "https://estatepro.vercel.app/favicon.svg",
      "description": "Premium real estate listings across the United States.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "350 Fifth Avenue, Suite 4800",
        "addressLocality": "New York",
        "addressRegion": "NY",
        "postalCode": "10118",
        "addressCountry": "US"
      },
      "telephone": "+12125550178",
      "email": "hello@estatepro.com",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
